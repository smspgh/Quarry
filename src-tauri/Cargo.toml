[package]
name = "quarry"
version = "0.1.18"
description = "Fast text, JSON and large-file editor"
authors = ["Steve Shirey"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "quarry_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
memmap2 = "0.9.12"
regex = "1.13.1"
memchr = "2.8.3"
grep-searcher = "0.1.17"
grep-regex = "0.1.14"
grep-matcher = "0.1.9"
ignore = "0.4.33"
encoding_rs = "0.8.42"
chardetng = "1.0.0"
parking_lot = "0.13.0"
thiserror = "2.0.21"
tempfile = "3.27.0"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-os = "2.4.0"
tauri-plugin-single-instance = "2.5.4"
notify = "8"
notify-debouncer-mini = "0.6"
trash = "5.2.9"
clipboard-win = "5"
portable-pty = "0.9.0"
tauri-plugin-updater = "2.14.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
